name: Build VideoPlyr APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew

      - name: Inline Plyr assets
        run: |
          curl -sL "https://cdn.plyr.io/3.4.6/plyr.js" -o plyr.js
          curl -sL "https://cdn.plyr.io/3.4.6/plyr.css" -o plyr.css
          python3 - <<'EOF'
          import re, pathlib
          html = pathlib.Path("app/src/main/assets/player.html").read_text()
          css = pathlib.Path("plyr.css").read_text()
          js = pathlib.Path("plyr.js").read_text()
          html = re.sub(r'<link[^>]*plyr.css[^>]*>', f'<style>{css}</style>', html)
          html = re.sub(r'<script[^>]*plyr.js[^>]*></script>', f'<script>{js}</script>', html)
          pathlib.Path("app/src/main/assets/player.html").write_text(html)
          EOF

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "VideoPlyr Build #${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
