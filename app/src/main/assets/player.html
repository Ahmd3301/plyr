<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Professional Player</title>
    <link href="https://cdn.plyr.io/3.4.6/plyr.css" rel="stylesheet">
    <script src="https://cdn.plyr.io/3.4.6/plyr.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* ✅ التصميم المطلوب من test3315.html */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --plyr-color-main: rgba(255, 255, 255, 0.4) !important; }
        .plyr--full-ui input[type=range] { color: #fff !important; }
        .plyr__control--overlaid { background: rgba(255, 255, 255, 0.15) !important; }
        .plyr--video .plyr__control.plyr__tab-focus, 
        .plyr--video .plyr__control:hover, 
        .plyr--video .plyr__control[aria-expanded=true] {
            background: rgba(255, 255, 255, 0.2) !important; color: #fff !important;
        }
        .plyr__menu__container {
            background: rgba(255, 255, 255, 0.12) !important;
            backdrop-filter: blur(15px) !important; border: none !important; color: #fff !important;
        }

        body, html {
            width: 100%; height: 100%; background: #000; overflow: hidden;
            padding: 0 !important; margin: 0 !important;
        }
        .video-player-container, .plyr { width: 100%; height: 100%; }

        /* الأبعاد */
        .plyr.mode-fill .plyr__video-wrapper video { object-fit: cover; }
        .plyr.mode-contain .plyr__video-wrapper video { object-fit: contain; }
        .plyr.mode-square .plyr__video-wrapper video { width: auto; height: 80%; margin: auto; }

        /* العنوان والقائمة */
        .plyr__title {
            position: absolute; bottom: calc(48px + 16px); left: 20px; z-index: 12;
            font-size: 15px; color: #fff; background: rgba(255, 255, 255, 0.12);
            border-radius: 4px; padding: 6px 14px; height: 34px; line-height: 22px;
            cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
            opacity: 0; visibility: hidden; backdrop-filter: blur(4px); transition: 0.4s;
        }
        .plyr--controls-visible .plyr__title { opacity: 1; visibility: visible; }

        .plyr__playlist {
            position: absolute; left: 20px; right: 20px; bottom: calc(48px + 16px + 34px + 16px);
            z-index: 20; opacity: 0; visibility: hidden; transition: 0.5s;
        }
        .playlist-open .plyr__playlist { opacity: 1; visibility: visible; }
        .playlist-wrapper { display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; }
        .playlist-item {
            flex: 0 0 auto; width: 240px; height: 135px; color: #fff;
            background: rgba(255, 255, 255, 0.12); border-radius: 4px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .playlist-item.active { background: rgba(255, 255, 255, 0.25); }

        .plyr__controls { background: transparent !important; padding: 0 20px 10px !important; }
        .plyr__control--resize::after { content: '⛶'; font-weight: 900; font-size: 19px; }
    </style>
</head>
<body>
    <div class="video-player-container">
        <video id="player" playsinline crossorigin></video>
    </div>

    <script>
        let player;
        let hls;

        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('player');
            
            player = new Plyr(video, {
                controls: ['rewind', 'play', 'fast-forward', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
                settings: ['quality', 'speed'],
                // إجبار الأزرار على الظهور وعدم الاختفاء برمجياً
                hideControls: true
            });

            const container = document.querySelector('.plyr');
            
            // إضافة العنوان
            const titleElement = document.createElement('div');
            titleElement.className = 'plyr__title';
            titleElement.innerHTML = 'Video player plyr.io <span>👍</span>';
            container.appendChild(titleElement);

            // إضافة القائمة
            const playlistElement = document.createElement('div');
            playlistElement.className = 'plyr__playlist';
            playlistElement.innerHTML = `<div class="playlist-wrapper">
                <div class="playlist-item active" data-src="demo1.mp4">Video #01</div>
                <div class="playlist-item" data-src="demo2.mp4">Video #02</div>
            </div>`;
            container.appendChild(playlistElement);

            titleElement.onclick = (e) => { e.stopPropagation(); container.classList.toggle('playlist-open'); };

            // زر الأبعاد
            const resizeBtn = document.createElement('button');
            resizeBtn.className = 'plyr__control plyr__control--resize';
            document.querySelector('.plyr__controls').appendChild(resizeBtn);
            
            const modes = ['mode-fill', 'mode-contain', 'mode-square'];
            let mIdx = 0;
            resizeBtn.onclick = () => {
                container.classList.remove(...modes);
                mIdx = (mIdx + 1) % modes.length;
                container.classList.add(modes[mIdx]);
            };
            container.classList.add('mode-fill');

            // ✅ حل مشكلة زر Fullscreen ليخرج من التطبيق
            const fsBtn = document.querySelector('[data-plyr="fullscreen"]');
            fsBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopImmediatePropagation();
                if(window.Android) Android.closeApp();
            }, true);

            window.loadVideo = (url, title) => {
                titleElement.innerHTML = title + ' <span>👍</span>';
                if (hls) hls.destroy();

                if (url.includes('.m3u8')) {
                    hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        // ✅ إجبار Plyr على إظهار الجودات لروابط HLS
                        const levels = hls.levels.map(l => l.height);
                        player.quality = {
                            default: levels[0],
                            options: levels,
                            forced: true,
                            onChange: (q) => hls.currentLevel = hls.levels.findIndex(l => l.height === q)
                        };
                    });
                } else {
                    video.src = url;
                }
                video.play();
            };
        });
    </script>
</body>
</html>
