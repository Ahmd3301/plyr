<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Professional Player</title>
    <link href="https://cdn.plyr.io/3.4.6/plyr.css" rel="stylesheet">
    <script src="https://cdn.plyr.io/3.4.6/plyr.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --plyr-color-main: rgba(255, 255, 255, 0.4) !important; }
        body, html { width: 100vw; height: 100vh; background: #000; overflow: hidden; padding: 0 !important; }
        .video-player-container { width: 100%; height: 100%; }
        .plyr { width: 100%; height: 100%; background: #000; }
        /* تصميم الـ UI المطلوب */
        .plyr__title {
            position: absolute; bottom: 64px; left: 20px; z-index: 12;
            font-size: 15px; color: #fff; background: rgba(255, 255, 255, 0.12);
            border-radius: 4px; padding: 6px 14px; opacity: 0; visibility: hidden;
            transition: all 0.4s; backdrop-filter: blur(4px);
        }
        .plyr--controls-visible .plyr__title { opacity: 1; visibility: visible; }
        .plyr__control--resize::after { content: '⛶'; font-weight: 900; font-size: 19px; }
        /* إعدادات قائمة الجودة */
        .plyr__menu__container { background: rgba(0,0,0,0.8) !important; color: #fff !important; }
    </style>
</head>
<body>
    <div class="video-player-container">
        <video id="player" playsinline crossorigin></video>
    </div>

    <script>
        let player;
        let hls;

        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('player');
            player = new Plyr(video, {
                controls: ['rewind', 'play', 'fast-forward', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
                settings: ['quality', 'speed'],
                fullscreen: { iosNative: false, container: '.plyr' }
            });

            const container = document.querySelector('.plyr');
            const titleElement = document.createElement('div');
            titleElement.className = 'plyr__title';
            titleElement.innerHTML = 'Video player plyr.io <span>👍</span>';
            container.appendChild(titleElement);

            // زر الأبعاد
            const controls = document.querySelector('.plyr__controls');
            const resizeBtn = document.createElement('button');
            resizeBtn.className = 'plyr__control plyr__control--resize';
            controls.appendChild(resizeBtn);
            
            const modes = ['mode-fill', 'mode-contain', 'mode-square'];
            let mIdx = 0;
            resizeBtn.onclick = () => {
                container.classList.remove(...modes);
                mIdx = (mIdx + 1) % modes.length;
                container.classList.add(modes[mIdx]);
            };
            container.classList.add('mode-fill');

            window.loadVideo = (url, title) => {
                titleElement.innerHTML = title + ' <span>👍</span>';
                if (Hls.isSupported() && url.includes('m3u8')) {
                    if (hls) hls.destroy();
                    hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    
                    // ✅ ميزة الجودات الـ HLS: استخراجها وحقنها في Plyr
                    hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                        const availableQualities = hls.levels.map((l) => l.height);
                        player.quality = {
                            default: availableQualities[0],
                            options: availableQualities,
                            forced: true,
                            onChange: (newQuality) => {
                                hls.levels.forEach((level, levelIndex) => {
                                    if (level.height === newQuality) {
                                        hls.currentLevel = levelIndex;
                                    }
                                });
                            }
                        };
                    });
                } else {
                    video.src = url;
                }
                video.play();
            };

            // الديمو عند البدء
            window.loadVideo('https://cdn.plyr.io/static/demo/View_From_A_Blue_Moon_Trailer-720p.mp4', 'Video player plyr.io');
        });
    </script>
</body>
</html>
